<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purpleBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="yellowBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="orangeBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Duo Tetris Mino Blocks -->
  <!-- Left Player Mino Group (T piece in purple + I block in cyan) -->
  <rect x="80" y="240" width="70" height="70" rx="12" fill="url(#purpleBlock)" stroke="#0f172a" stroke-width="4"/>
  <rect x="154" y="240" width="70" height="70" rx="12" fill="url(#purpleBlock)" stroke="#0f172a" stroke-width="4"/>
  <rect x="228" y="240" width="70" height="70" rx="12" fill="url(#purpleBlock)" stroke="#0f172a" stroke-width="4"/>
  <rect x="154" y="166" width="70" height="70" rx="12" fill="url(#purpleBlock)" stroke="#0f172a" stroke-width="4"/>

  <!-- Right Player Mino Group (O piece in yellow + L piece in orange) -->
  <rect x="260" y="166" width="70" height="70" rx="12" fill="url(#yellowBlock)" stroke="#0f172a" stroke-width="4"/>
  <rect x="334" y="166" width="70" height="70" rx="12" fill="url(#yellowBlock)" stroke="#0f172a" stroke-width="4"/>
  <rect x="260" y="240" width="70" height="70" rx="12" fill="url(#yellowBlock)" stroke="#0f172a" stroke-width="4"/>
  <rect x="334" y="240" width="70" height="70" rx="12" fill="url(#yellowBlock)" stroke="#0f172a" stroke-width="4"/>

  <!-- Lower I-Piece base -->
  <rect x="110" y="324" width="70" height="70" rx="12" fill="url(#cyanBlock)" stroke="#0f172a" stroke-width="4"/>
  <rect x="184" y="324" width="70" height="70" rx="12" fill="url(#cyanBlock)" stroke="#0f172a" stroke-width="4"/>
  <rect x="258" y="324" width="70" height="70" rx="12" fill="url(#orangeBlock)" stroke="#0f172a" stroke-width="4"/>
  <rect x="332" y="324" width="70" height="70" rx="12" fill="url(#orangeBlock)" stroke="#0f172a" stroke-width="4"/>
</svg>
